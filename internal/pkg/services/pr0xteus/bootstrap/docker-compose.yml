name: pr0xteus

services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:mode=755,noexec,nosuid,size=8m
      - /tmp:mode=1777,noexec,nosuid,size=8m
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
          pids: 64
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      VOLUMES: 0
      EXEC: 0
      INFO: 0
      VERSION: 0
      LOG_LEVEL: warning
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    expose:
      - "2375"
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -qx 'OK'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pr0xteus:
    image: ${PR0XTEUS_CONTROLLER_IMAGE:?run pr0xteus setup first}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=32m
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
          pids: 128
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      PR0XTEUS_API_TOKEN: ${PR0XTEUS_API_TOKEN:?run pr0xteus setup first}
      PR0XTEUS_CELL_NETWORK: pr0xteus-egress
      PR0XTEUS_CELL_CONTROL_NETWORK: pr0xteus-cell-control
      PR0XTEUS_MANAGED_SCOPE: pr0xteus-compose
      PR0XTEUS_DOCKER_HOST: tcp://docker-socket-proxy:2375
      TUNNEL_POOL_LISTEN_ADDR: 0.0.0.0:8000
      TUNNEL_POOL_METRICS_ADDR: 0.0.0.0:9091
      TUNNEL_POOL_SOCKS_ADDR: 0.0.0.0:1080
      TUNNEL_POOL_SOCKS_PUBLIC_ADDR: ${PR0XTEUS_SOCKS_PUBLIC_ADDRESS:-127.0.0.1:1080}
      TUNNEL_POOL_BUNDLE_DIR: ${PR0XTEUS_CONFIG_DIR:?run pr0xteus setup first}/secrets/wireguard
      TUNNEL_POOL_POOLS_FILE: ${PR0XTEUS_CONFIG_DIR:?run pr0xteus setup first}/secrets/pools.yaml
      TUNNEL_POOL_ROUTING_FILE: ${PR0XTEUS_CONFIG_DIR:?run pr0xteus setup first}/config/egress-routing.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-true}
    ports:
      - "${PR0XTEUS_HTTP_HOST_PORT:-127.0.0.1:8000}:8000"
      - "${PR0XTEUS_METRICS_HOST_PORT:-127.0.0.1:9091}:9091"
      - "${PR0XTEUS_SOCKS_HOST_PORT:-127.0.0.1:1080}:1080"
    volumes:
      - type: bind
        source: ${PR0XTEUS_CONFIG_DIR:?run pr0xteus setup first}
        target: ${PR0XTEUS_CONFIG_DIR:?run pr0xteus setup first}
        read_only: true
    networks:
      - control
      - cell-control
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/healthz | grep -qx 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # This sidecar gets its own tailnet identity. It never publishes a host
  # port; Tailscale Serve proxies tailnet HTTP to the private controller.
  tailscale:
    image: tailscale/tailscale:v1.96.5@sha256:dbeff02d2337344b351afac203427218c4d0a06c43fc10a865184063498472a6
    profiles: ["tailscale"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # Kernel-mode Tailscale needs exactly these capabilities and /dev/net/tun.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
      - /var/run:mode=755,noexec,nosuid,size=8m
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 128
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-pr0xteus}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---accept-dns=false}
    volumes:
      - type: bind
        source: ${PR0XTEUS_CONFIG_DIR:?run pr0xteus setup first}/tailscale/state
        target: /var/lib/tailscale
      - type: bind
        source: /dev/net/tun
        target: /dev/net/tun
    depends_on:
      pr0xteus:
        condition: service_healthy
    networks:
      - control
      - tailnet
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  control:
    internal: true
    name: pr0xteus-control
  cell-control:
    internal: true
    name: pr0xteus-cell-control
  egress:
    name: pr0xteus-egress
  tailnet:
    name: pr0xteus-tailnet
