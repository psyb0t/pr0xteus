name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  code:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test-coverage"
      # Full security scan (govulncheck + semgrep) merged into sec.sarif, run in
      # the dev image. Gates on findings; two false-positive math/rand hits
      # (upstream selection + retry jitter, no crypto entropy needed) carry a
      # bare `// nosemgrep`.
      sec_command: "make sec"
      # Runs all codegen then fails on a dirty tree, catching a hand-edited or
      # un-regenerated generated file. Idempotent on pr0xteus, so any diff is a
      # real drift.
      generate_command: "make generate"
      coverage_file: "coverage-percent.txt"
      coverage_artifact: "coverage-percent.txt"
      sarif_file: "sec.sarif"
      sarif_category: "go"

  docker:
    needs: [code]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/pr0xteus
      target_platforms: "linux/amd64,linux/arm64"
      build_targets: >-
        [{"file":"cell/Dockerfile","tag_prefix":"cell-","stage":0},{"file":"Dockerfile","tag_suffix":"","stage":1,"build_args":"APP_NAME=pr0xteus\nBUILD_COMMIT=${{ github.sha }}\nBUILD_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}"}]
      scan_severity: "high"
      scan_fail_build: false
      dockerhub_private: false
      sync_description: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true

  publish-to-clawhub:
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
