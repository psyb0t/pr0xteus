name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  go:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/go-workflow.yml@master
    with:
      go_version: "1.26.6"
      dep_command: "make dep"
      lint_command: "make lint"
      test_command: "make test-coverage"
      is_vendored: true
      coverage_file: "coverage-percent.txt"

  docker:
    needs: [go]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/pr0xteus
      target_platforms: "linux/amd64,linux/arm64"
      build_targets: >-
        [{"file":"cell/Dockerfile","tag_prefix":"cell-","stage":0},{"file":"Dockerfile","tag_suffix":"","stage":1,"build_args":"PR0XTEUS_BUILT_CELL_IMAGE=psyb0t/pr0xteus:cell-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}"}]
      scan_severity: "high"
      scan_fail_build: false
      dockerhub_private: false
      sync_description: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [go]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true

  publish-to-clawhub:
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
